<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ARGOS · Monitor Electoral Paraguay</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔍</text></svg>" />
  <style>
    :root {
      --bg:        #0a0a0f;
      --surface:   #11111a;
      --card:      #181825;
      --border:    #2a2a3d;
      --accent:    #7c3aed;
      --accent2:   #a855f7;
      --danger:    #dc2626;
      --success:   #16a34a;
      --warn:      #d97706;
      --text:      #e2e8f0;
      --muted:     #64748b;
      --admin:     #ef4444;
      --operador:  #f59e0b;
      --viewer:    #22d3ee;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── LOGIN ─────────────────────────────────────────── */
    #screen-login {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(ellipse at 50% 40%, #1e0a3c 0%, var(--bg) 70%);
    }
    .login-box {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 0 60px #7c3aed22;
    }
    .eye-logo {
      text-align: center;
      margin-bottom: 1.5rem;
    }
    .eye-logo svg { width: 72px; height: 72px; filter: drop-shadow(0 0 16px #a855f7); }
    .login-box h1 { text-align: center; font-size: 1.4rem; letter-spacing: .15em; color: var(--accent2); margin-bottom: .3rem; }
    .login-box p  { text-align: center; font-size: .75rem; color: var(--muted); margin-bottom: 2rem; letter-spacing: .1em; }
    .form-group { margin-bottom: 1rem; }
    .form-group label { display: block; font-size: .75rem; color: var(--muted); margin-bottom: .4rem; letter-spacing: .08em; text-transform: uppercase; }
    .form-group input {
      width: 100%; padding: .65rem .9rem;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 8px; color: var(--text); font-size: .95rem;
      outline: none; transition: border .2s;
    }
    .form-group input:focus { border-color: var(--accent); }
    .btn-primary {
      width: 100%; padding: .75rem;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border: none; border-radius: 8px; color: #fff;
      font-size: 1rem; font-weight: 600; cursor: pointer;
      letter-spacing: .05em; transition: opacity .2s;
      margin-top: .5rem;
    }
    .btn-primary:hover { opacity: .88; }
    .btn-primary:disabled { opacity: .4; cursor: not-allowed; }
    .login-error {
      margin-top: .9rem; padding: .6rem .9rem;
      background: #dc262622; border: 1px solid var(--danger);
      border-radius: 8px; font-size: .85rem; color: #fca5a5;
      display: none;
    }

    /* ── APP ────────────────────────────────────────────── */
    #screen-app { flex: 1; display: none; flex-direction: column; }

    /* Header */
    header {
      background: var(--card);
      border-bottom: 1px solid var(--border);
      padding: .75rem 1.5rem;
      display: flex; align-items: center; gap: 1rem;
    }
    header svg { width: 32px; height: 32px; flex-shrink: 0; filter: drop-shadow(0 0 8px #a855f7); }
    header h1 { font-size: 1rem; letter-spacing: .15em; color: var(--accent2); flex: 1; }
    .badge {
      font-size: .7rem; padding: .25rem .65rem; border-radius: 999px;
      font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
    }
    .badge-admin      { background: #ef444422; color: var(--admin);    border: 1px solid var(--admin); }
    .badge-operador   { background: #f59e0b22; color: var(--operador); border: 1px solid var(--operador); }
    .badge-visualizador { background: #22d3ee22; color: var(--viewer); border: 1px solid var(--viewer); }
    #user-info { font-size: .85rem; color: var(--muted); }
    .btn-logout {
      background: none; border: 1px solid var(--border);
      border-radius: 6px; color: var(--muted); padding: .35rem .75rem;
      font-size: .8rem; cursor: pointer; transition: all .2s;
    }
    .btn-logout:hover { border-color: var(--danger); color: var(--danger); }

    /* Layout */
    .app-body { flex: 1; display: flex; overflow: hidden; height: calc(100vh - 57px); }

    /* Sidebar */
    aside {
      width: 220px; flex-shrink: 0;
      background: var(--surface); border-right: 1px solid var(--border);
      padding: 1rem .75rem; display: flex; flex-direction: column; gap: .3rem;
    }
    .nav-label { font-size: .65rem; color: var(--muted); letter-spacing: .12em; text-transform: uppercase; padding: .5rem .5rem .25rem; }
    .nav-btn {
      display: flex; align-items: center; gap: .6rem;
      padding: .55rem .75rem; border-radius: 8px;
      cursor: pointer; font-size: .88rem; color: var(--muted);
      border: none; background: none; width: 100%; text-align: left;
      transition: all .2s;
    }
    .nav-btn:hover   { background: var(--card); color: var(--text); }
    .nav-btn.active  { background: #7c3aed22; color: var(--accent2); }
    .nav-btn.disabled { opacity: .35; cursor: not-allowed; }

    /* Main panel */
    main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

    /* ── CHAT PANEL ─────────────────────────────────────── */
    #panel-chat { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    .chat-messages {
      flex: 1; overflow-y: auto; padding: 1.5rem;
      display: flex; flex-direction: column; gap: 1rem;
    }
    .msg { display: flex; flex-direction: column; max-width: 80%; }
    .msg.user  { align-self: flex-end; }
    .msg.agent { align-self: flex-start; }
    .msg-bubble {
      padding: .75rem 1rem; border-radius: 12px;
      font-size: .9rem; line-height: 1.55; white-space: pre-wrap; word-break: break-word;
    }
    .msg.user  .msg-bubble { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff; border-bottom-right-radius: 3px; }
    .msg.agent .msg-bubble { background: var(--card); border: 1px solid var(--border); border-bottom-left-radius: 3px; }
    .msg-meta { font-size: .7rem; color: var(--muted); margin-top: .25rem; padding: 0 .25rem; }
    .msg.user  .msg-meta { text-align: right; }
    .typing { display: flex; gap: 4px; align-items: center; padding: .75rem 1rem; }
    .typing span { width: 7px; height: 7px; background: var(--muted); border-radius: 50%; animation: bounce .9s infinite; }
    .typing span:nth-child(2) { animation-delay: .15s; }
    .typing span:nth-child(3) { animation-delay: .3s; }
    @keyframes bounce { 0%,80%,100% { transform: translateY(0); } 40% { transform: translateY(-6px); } }

    .chat-input-bar {
      border-top: 1px solid var(--border); padding: 1rem 1.5rem;
      background: var(--surface); display: flex; gap: .75rem; align-items: flex-end;
    }
    #chat-input {
      flex: 1; background: var(--card); border: 1px solid var(--border);
      border-radius: 10px; padding: .65rem 1rem; color: var(--text);
      font-size: .95rem; resize: none; outline: none; transition: border .2s;
      max-height: 140px; line-height: 1.5;
      font-family: inherit;
    }
    #chat-input:focus { border-color: var(--accent); }
    #chat-input:disabled { opacity: .5; }
    .btn-send {
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border: none; border-radius: 10px; color: #fff;
      padding: .65rem 1.1rem; cursor: pointer; font-size: 1.1rem;
      transition: opacity .2s; flex-shrink: 0;
    }
    .btn-send:hover    { opacity: .85; }
    .btn-send:disabled { opacity: .35; cursor: not-allowed; }
    .viewer-notice {
      flex: 1; display: flex; align-items: center; justify-content: center;
      flex-direction: column; gap: .75rem; color: var(--muted); text-align: center; padding: 2rem;
    }
    .viewer-notice svg { opacity: .3; }
    .viewer-notice p { font-size: .9rem; }

    /* ── HISTORY PANEL ──────────────────────────────────── */
    #panel-history { flex: 1; overflow-y: auto; padding: 2rem; display: none; }
    #panel-history h2 { font-size: 1rem; color: var(--accent2); margin-bottom: 1.5rem; letter-spacing: .1em; }
    .history-empty { color: var(--muted); font-size: .9rem; }

    /* ── ADMIN PANEL ────────────────────────────────────── */
    #panel-admin { flex: 1; overflow-y: auto; padding: 2rem; display: none; }
    #panel-admin h2 { font-size: 1rem; color: var(--accent2); margin-bottom: 1.5rem; letter-spacing: .1em; }
    .users-table { width: 100%; border-collapse: collapse; font-size: .88rem; }
    .users-table th { text-align: left; padding: .6rem 1rem; color: var(--muted); font-size: .72rem; letter-spacing: .1em; text-transform: uppercase; border-bottom: 1px solid var(--border); }
    .users-table td { padding: .7rem 1rem; border-bottom: 1px solid #1e1e2e; }
    .users-table tr:hover td { background: var(--card); }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 99px; }

    /* System message */
    .system-msg {
      text-align: center; font-size: .75rem; color: var(--muted);
      padding: .4rem 1rem; background: var(--surface);
      border-radius: 999px; align-self: center;
    }
  </style>
</head>
<body>

<!-- ══ LOGIN ═══════════════════════════════════════════════════════════════ -->
<div id="screen-login">
  <div class="login-box">
    <div class="eye-logo">
      <svg viewBox="0 0 72 72" fill="none" xmlns="http://www.w3.org/2000/svg">
        <ellipse cx="36" cy="36" rx="34" ry="20" stroke="#a855f7" stroke-width="2.5"/>
        <circle cx="36" cy="36" r="11" fill="#7c3aed" opacity=".7"/>
        <circle cx="36" cy="36" r="6"  fill="#a855f7"/>
        <circle cx="39" cy="33" r="2"  fill="#e9d5ff" opacity=".8"/>
        <line x1="2" y1="36" x2="10" y2="36" stroke="#a855f7" stroke-width="2" opacity=".5"/>
        <line x1="62" y1="36" x2="70" y2="36" stroke="#a855f7" stroke-width="2" opacity=".5"/>
      </svg>
    </div>
    <h1>ARGOS</h1>
    <p>SISTEMA DE MONITOREO · REDES SOCIALES · TIEMPO REAL</p>
    <p style="text-align:center;font-size:.7rem;color:#475569;margin-top:-.5rem;margin-bottom:2rem;letter-spacing:.1em;">Departamento de Cibercrimen · PNP</p>
    <div class="form-group">
      <label>Usuario</label>
      <input type="text" id="login-user" placeholder="usuario" autocomplete="username" />
    </div>
    <div class="form-group">
      <label>Contraseña</label>
      <input type="password" id="login-pass" placeholder="••••••••" autocomplete="current-password" />
    </div>
    <button class="btn-primary" id="btn-login">INGRESAR</button>
    <div class="login-error" id="login-error"></div>
  </div>
</div>

<!-- ══ APP ═════════════════════════════════════════════════════════════════ -->
<div id="screen-app">
  <header>
    <svg viewBox="0 0 32 32" fill="none">
      <ellipse cx="16" cy="16" rx="15" ry="9" stroke="#a855f7" stroke-width="1.5"/>
      <circle cx="16" cy="16" r="5" fill="#7c3aed" opacity=".8"/>
      <circle cx="16" cy="16" r="2.5" fill="#a855f7"/>
      <circle cx="17.2" cy="14.8" r=".8" fill="#e9d5ff" opacity=".9"/>
    </svg>
    <h1>ARGOS</h1>
    <span id="user-info"></span>
    <span id="role-badge" class="badge"></span>
    <button class="btn-logout" id="btn-logout">Salir</button>
  </header>

  <div class="app-body">
    <!-- Sidebar -->
    <aside>
      <div class="nav-label">Navegación</div>
      <button class="nav-btn active" id="nav-chat" onclick="showPanel('chat')">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        Chat IA
      </button>
      <button class="nav-btn" id="nav-history" onclick="showPanel('history')">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        Historial
      </button>
      <button class="nav-btn" id="nav-admin" onclick="showPanel('admin')">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        Usuarios
      </button>
    </aside>

    <!-- Main -->
    <main>

      <!-- Chat -->
      <div id="panel-chat">
        <div class="chat-messages" id="chat-messages">
          <div class="system-msg">Sesión iniciada — ARGOS activo</div>
        </div>
        <div class="chat-input-bar" id="chat-input-bar">
          <textarea id="chat-input" rows="1" placeholder="Escribe un mensaje…"></textarea>
          <button class="btn-send" id="btn-send" title="Enviar">&#9658;</button>
        </div>
      </div>

      <!-- History -->
      <div id="panel-history">
        <h2>HISTORIAL DE CONVERSACIONES</h2>
        <div id="history-content" class="history-empty">Cargando…</div>
      </div>

      <!-- Admin -->
      <div id="panel-admin">
        <h2>GESTIÓN DE USUARIOS</h2>
        <div id="admin-content"></div>
      </div>

    </main>
  </div>
</div>

<script>
  const BACKEND_URL = 'https://argos-backend-production-ede7.up.railway.app';

  // ── Estado ──────────────────────────────────────────────────────────────
  let token = null, userRole = null, userName = null;
  const history = [];

  // ── Login ────────────────────────────────────────────────────────────────
  async function doLogin() {
    const username = document.getElementById('login-user').value.trim();
    const password = document.getElementById('login-pass').value;
    const errEl    = document.getElementById('login-error');
    const btn      = document.getElementById('btn-login');
    errEl.style.display = 'none';
    btn.disabled = true; btn.textContent = 'Verificando…';

    try {
      const res = await fetch(`${BACKEND_URL}/api/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Error de autenticación');
      token    = data.token;
      userRole = data.role;
      userName = data.username;
      initApp();
    } catch (e) {
      errEl.textContent = e.message;
      errEl.style.display = 'block';
    } finally {
      btn.disabled = false; btn.textContent = 'INGRESAR';
    }
  }

  function initApp() {
    document.getElementById('screen-login').style.display = 'none';
    document.getElementById('screen-app').style.display  = 'flex';
    document.getElementById('user-info').textContent = userName;

    const badge = document.getElementById('role-badge');
    badge.textContent = userRole;
    badge.className   = `badge badge-${userRole}`;

    // Restringir navegación según rol
    const navAdmin = document.getElementById('nav-admin');
    if (userRole !== 'admin') { navAdmin.classList.add('disabled'); }

    // Visualizadores no pueden chatear
    if (userRole === 'visualizador') {
      const bar = document.getElementById('chat-input-bar');
      bar.innerHTML = `
        <div class="viewer-notice" style="flex-direction:row;gap:.6rem;padding:.75rem 1.5rem;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#64748b" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
          <span style="font-size:.85rem;color:#64748b">Rol visualizador — solo lectura. Usa el historial para revisar conversaciones.</span>
        </div>`;
    }
    showPanel('chat');
  }

  function doLogout() {
    token = null; userRole = null; userName = null;
    history.length = 0;
    document.getElementById('chat-messages').innerHTML = '<div class="system-msg">Sesión iniciada — ARGOS activo</div>';
    document.getElementById('screen-app').style.display  = 'none';
    document.getElementById('screen-login').style.display = 'flex';
    document.getElementById('login-pass').value = '';
    document.getElementById('login-error').style.display = 'none';
  }

  // ── Paneles ──────────────────────────────────────────────────────────────
  function showPanel(name) {
    if (name === 'admin' && userRole !== 'admin') return;
    ['chat','history','admin'].forEach(p => {
      document.getElementById(`panel-${p}`).style.display = 'none';
      document.getElementById(`nav-${p}`).classList.remove('active');
    });
    document.getElementById(`panel-${name}`).style.display = 'flex';
    document.getElementById(`panel-${name}`).style.flexDirection = 'column';
    document.getElementById(`nav-${name}`).classList.add('active');

    if (name === 'history') loadHistory();
    if (name === 'admin')   loadUsers();
  }

  // ── Chat ─────────────────────────────────────────────────────────────────
  function addMessage(role, text, ts) {
    const box  = document.getElementById('chat-messages');
    const wrap = document.createElement('div');
    wrap.className = `msg ${role}`;
    const time = ts ? new Date(ts).toLocaleTimeString('es', {hour:'2-digit',minute:'2-digit'}) : new Date().toLocaleTimeString('es', {hour:'2-digit',minute:'2-digit'});
    wrap.innerHTML = `
      <div class="msg-bubble">${escHtml(text)}</div>
      <div class="msg-meta">${role === 'user' ? userName : 'ARGOS'} · ${time}</div>`;
    box.appendChild(wrap);
    box.scrollTop = box.scrollHeight;
    return wrap;
  }

  function showTyping() {
    const box  = document.getElementById('chat-messages');
    const el   = document.createElement('div');
    el.className = 'msg agent';
    el.id = 'typing-indicator';
    el.innerHTML = `<div class="msg-bubble typing"><span></span><span></span><span></span></div>`;
    box.appendChild(el);
    box.scrollTop = box.scrollHeight;
  }
  function removeTyping() {
    const el = document.getElementById('typing-indicator');
    if (el) el.remove();
  }

  async function sendChat() {
    if (userRole === 'visualizador') return;
    const input = document.getElementById('chat-input');
    const text  = input.value.trim();
    if (!text) return;

    input.value = ''; input.style.height = 'auto';
    document.getElementById('btn-send').disabled = true;
    input.disabled = true;

    history.push({ role: 'user', content: text });
    addMessage('user', text);
    showTyping();

    try {
      const res = await fetch(`${BACKEND_URL}/api/chat`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
        body: JSON.stringify({
          model: 'claude-sonnet-4-6',
          max_tokens: 1024,
          messages: history,
        }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Error del servidor');
      const reply = data.content?.[0]?.text || '(sin respuesta)';
      history.push({ role: 'assistant', content: reply });
      removeTyping();
      addMessage('agent', reply);
    } catch (e) {
      removeTyping();
      addMessage('agent', `Error: ${e.message}`);
    } finally {
      document.getElementById('btn-send').disabled = false;
      input.disabled = false;
      input.focus();
    }
  }

  // ── Historia ─────────────────────────────────────────────────────────────
  async function loadHistory() {
    const el = document.getElementById('history-content');
    el.textContent = 'Cargando…';
    try {
      const res  = await fetch(`${BACKEND_URL}/api/chat/history`, { headers: { 'Authorization': `Bearer ${token}` } });
      const data = await res.json();
      el.textContent = data.message || JSON.stringify(data);
    } catch (e) { el.textContent = `Error: ${e.message}`; }
  }

  // ── Usuarios (admin) ─────────────────────────────────────────────────────
  async function loadUsers() {
    const el = document.getElementById('admin-content');
    el.textContent = 'Cargando…';
    try {
      const res   = await fetch(`${BACKEND_URL}/api/users`, { headers: { 'Authorization': `Bearer ${token}` } });
      const users = await res.json();
      const roleColor = r => ({ admin: 'admin', operador: 'operador', visualizador: 'visualizador' }[r] || '');
      el.innerHTML = `
        <table class="users-table">
          <thead><tr><th>Usuario</th><th>Rol</th></tr></thead>
          <tbody>
            ${users.map(u => `<tr><td>${escHtml(u.username)}</td><td><span class="badge badge-${roleColor(u.role)}">${escHtml(u.role)}</span></td></tr>`).join('')}
          </tbody>
        </table>`;
    } catch (e) { el.textContent = `Error: ${e.message}`; }
  }

  // ── Utils ────────────────────────────────────────────────────────────────
  function escHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // ── Event listeners ──────────────────────────────────────────────────────
  document.getElementById('btn-login').addEventListener('click', doLogin);
  document.getElementById('login-pass').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
  document.getElementById('btn-logout').addEventListener('click', doLogout);

  document.getElementById('btn-send').addEventListener('click', sendChat);
  document.getElementById('chat-input').addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendChat(); }
  });
  document.getElementById('chat-input').addEventListener('input', function() {
    this.style.height = 'auto';
    this.style.height = Math.min(this.scrollHeight, 140) + 'px';
  });
</script>
</body>
</html>
